name: Windows app validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-validation.yml'
      - 'scripts/**'
      - 'meter_green.py'
      - 'live_link.py'
      - 'bridge/**'
      - 'app.py'
      - 'app_model.py'
      - 'app_update.py'
      - 'run_live.py'
      - 'run_video.py'
      - 'meter_core.py'
      - 'requirements.txt'
      - 'testing/**'
      - 'Launch NBA2K CV.bat'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Create app environment
        shell: pwsh
        run: python -m venv .venv
      - name: Install app dependencies
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Run unit and integration tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s testing -v
      - name: Start Windows GUI and inspect tabs
        shell: pwsh
        run: .\.venv\Scripts\python.exe testing\windows_smoke.py
      - name: Build backwards-compatible update and import bundled runtime
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\build_release.py --repository jordainejohnson087-cloud/nba2k-cv --out test_results\release.zip
          Expand-Archive test_results\release.zip -DestinationPath test_results\bundle -Force
          Push-Location test_results\bundle
          ..\..\.venv\Scripts\python.exe -c "import run_live; assert run_live.GTUNER_SOURCE; assert run_live.HEARTBEAT_SOURCE; print('Bundled runtime imported')"
          Pop-Location
      - name: Upload desktop design preview
        uses: actions/upload-artifact@v4
        with:
          name: desktop-design-preview
          path: test_results/ui_preview.png
          retention-days: 7
